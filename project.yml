name: FilmEngineCamera
options:
  bundleIdPrefix: ai.gridlight
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
targets:
  FilmEngineCamera:
    type: application
    platform: iOS
    sources:
      - FilmEngineCamera
    info:
      path: FilmEngineCamera/Info.plist
      properties:
        CFBundleDisplayName: Film Engine Camera
        UILaunchScreen: {}
        NSCameraUsageDescription: Camera access is required to frame and record video.
        NSMicrophoneUsageDescription: Microphone access is required to record production sound.
        UIRequiredDeviceCapabilities: [camera-flash]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.gridlight.filmenginecamera
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
