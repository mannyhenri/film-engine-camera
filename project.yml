name: FilmEngineCamera
options:
  bundleIdPrefix: ai.gridlight
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
targets:
  FilmEngineCamera:
    type: application
    platform: iOS
    sources:
      - FilmEngineCamera
    info:
      path: FilmEngineCamera/Info.plist
      properties:
        CFBundleDisplayName: FE Camera
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Connect to Film Engine on your Mac to save clips into a selected project.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CameraBridgeURL: $(CAMERA_BRIDGE_URL)
        CameraBridgeToken: $(CAMERA_BRIDGE_TOKEN)
        NSCameraUsageDescription: Camera access is required to frame and record video.
        NSMicrophoneUsageDescription: Microphone access is required to record production sound.
        NSPhotoLibraryAddUsageDescription: Save recorded footage to Photos.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: true
        UIRequiredDeviceCapabilities: [video-camera]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.gridlight.filmenginecamera
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W7QXFS7XBU
        MARKETING_VERSION: 0.4.1
        CURRENT_PROJECT_VERSION: 7
